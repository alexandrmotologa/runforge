<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="facet-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="facet-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="facet-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="gold-beak" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g filter="url(#subtle-shadow)">

      <!-- Hexagonal Architectural Gateway Frame -->
      <polygon points="512,120 832,305 832,675 512,860 192,675 192,305"
               fill="none" stroke="#0f172a" stroke-width="32" stroke-linejoin="round" />
      <polygon points="512,145 810,317 810,663 512,835 214,663 214,317"
               fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="16 12" opacity="0.4" />

      <!-- Watertight Solid Silhouette Base (Prevents white background leak) -->
      <path d="M 512,210
               L 590,265 L 675,320 L 730,420 L 755,560 L 690,690 L 620,770 L 512,825
               L 404,770 L 334,690 L 269,560 L 294,420 L 349,320 L 434,265 Z"
            fill="#020617" />

      <!-- Upper Crown & Brow Facets -->
      <polygon points="512,210 555,275 512,320 469,275" fill="url(#facet-light)" />
      <polygon points="512,210 590,265 555,275" fill="#475569" />
      <polygon points="512,210 434,265 469,275" fill="#1e293b" />

      <!-- Cranial Crest Plates -->
      <polygon points="555,275 640,310 590,360 512,320" fill="url(#facet-mid)" />
      <polygon points="469,275 384,310 434,360 512,320" fill="url(#facet-dark)" />
      <polygon points="590,265 675,320 640,310" fill="#334155" />
      <polygon points="434,265 349,320 384,310" fill="#0f172a" />

      <!-- Temples & Cheek Flares -->
      <polygon points="640,310 710,395 650,440 590,360" fill="url(#facet-light)" />
      <polygon points="384,310 314,395 374,440 434,360" fill="url(#facet-dark)" />
      <polygon points="675,320 740,430 710,395" fill="#1e293b" />
      <polygon points="349,320 284,430 314,395" fill="#0b0f19" />

      <!-- Peregrine Malar Armor Plates (Cheekbones) -->
      <polygon points="650,440 710,540 630,550 580,470" fill="url(#facet-dark)" />
      <polygon points="374,440 314,540 394,550 444,470" fill="url(#facet-mid)" />

      <!-- Mid-Face Bridge & Center Keel -->
      <polygon points="512,320 560,400 512,470 464,400" fill="#1e293b" />
      <polygon points="560,400 590,360 580,470 512,470" fill="url(#facet-light)" />
      <polygon points="464,400 434,360 444,470 512,470" fill="url(#facet-dark)" />

      <!-- Emerald / Cyan Predator Optics (Almond-Shaped Alert Eyes) -->
      <!-- Left Eye Assembly -->
      <polygon points="434,375 490,390 448,410" fill="#020617" />
      <polygon points="440,380 482,392 452,406" fill="url(#emerald-glow)" />
      <polygon points="456,386 468,393 458,401" fill="#ffffff" opacity="0.9" />

      <!-- Right Eye Assembly -->
      <polygon points="590,375 534,390 576,410" fill="#020617" />
      <polygon points="584,380 542,392 572,406" fill="url(#emerald-glow)" />
      <polygon points="568,386 556,393 566,401" fill="#ffffff" opacity="0.9" />

      <!-- Razor Forge Beak (Golden Amber Hook with Sharp Vector Apex) -->
      <polygon points="512,470 548,515 512,610 476,515" fill="url(#gold-beak)" />
      <polygon points="512,470 548,515 512,610" fill="#f59e0b" />
      <polygon points="512,470 476,515 512,610" fill="#b45309" />
      <polygon points="512,610 522,570 512,540 502,570" fill="#78350f" />

      <!-- Throat & Gorget Plates (Causal Vector Nodes) -->
      <polygon points="512,610 580,640 512,710 444,640" fill="url(#facet-mid)" />
      <polygon points="512,610 548,515 580,640" fill="#0f172a" />
      <polygon points="512,610 476,515 444,640" fill="#1e293b" />

      <!-- Folded Mantle & Wing Vector Facets (Left Wing) -->
      <polygon points="444,640 394,550 334,660 380,720" fill="url(#facet-dark)" />
      <polygon points="380,720 334,660 280,690 340,760" fill="#0b0f19" />
      <polygon points="380,720 444,640 450,750 410,790" fill="url(#facet-mid)" />

      <!-- Folded Mantle & Wing Vector Facets (Right Wing) -->
      <polygon points="580,640 630,550 690,660 644,720" fill="url(#facet-light)" />
      <polygon points="644,720 690,660 744,690 684,760" fill="#334155" />
      <polygon points="644,720 580,640 574,750 614,790" fill="url(#facet-light)" />

      <!-- Pectoral Shield & Apex DAG Tail Feathers -->
      <polygon points="512,710 574,750 512,825 450,750" fill="url(#facet-light)" />
      <polygon points="512,710 540,740 512,790 484,740" fill="url(#emerald-glow)" opacity="0.85" />

      <!-- Execution Node Accent Dots -->
      <circle cx="512" cy="180" r="6" fill="#10b981" />
      <circle cx="760" cy="320" r="5" fill="#10b981" />
      <circle cx="264" cy="320" r="5" fill="#10b981" />
      <circle cx="780" cy="650" r="5" fill="#10b981" />
      <circle cx="244" cy="650" r="5" fill="#10b981" />
      <circle cx="512" cy="800" r="5" fill="#00f5ff" />
    </g>
  </g>
</svg>
